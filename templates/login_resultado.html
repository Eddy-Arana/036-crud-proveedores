{% extends "base.html" %}

{% block title %}Resultado del Login{% endblock %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-body">

                <div class="alert alert-{{ tipo }}" role="alert">

                    <h4 class="alert-heading">
                        Resultado del inicio de sesión
                    </h4>

                    <p class="mb-0">
                        {{ mensaje }}
                    </p>

                </div>


                {% if tipo == 'success' %}

                    <p>
                        Usuario:
                        <strong>{{ usuario }}</strong>
                    </p>

                    <p>
                        Recordarme:
                        <strong>{{ recordarme }}</strong>
                    </p>

                {% endif %}


                <a href="{{ url_for('login') }}"
                   class="btn btn-primary">
                    Volver al login
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
