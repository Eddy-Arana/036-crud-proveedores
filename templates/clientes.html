{% extends "base.html" %}

{% block title %}Registros de clientes{% endblock %}

{% block contenido %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card shadow">
            <div class= "card-header bg-primary text-white">
                <h2 class="mb-0">Registro de Clientes</h2>
            </div>

            <div class="card-body">

                <form method="POST">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        name="nombre"
                        required
                        >
            </div>

              <div class="mb-3">
                        <label for="nit" class="form-label">
                            NIT
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nit"
                            name="nit"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="correo" class="form-label">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="correo"
                            name="correo"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="telefono" class="form-label">
                            Teléfono
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="telefono"
                            name="telefono"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="direccion" class="form-label">
                            Dirección
                        </label>

                        <textarea
                            class="form-control"
                            id="direccion"
                            name="direccion"
                            rows="3"
                            required
                        ></textarea>
                    </div>


                    <button type="submit" class="btn btn-primary">
                        Registrar cliente
                    </button>

                    <a href="{{ url_for('inicio') }}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
