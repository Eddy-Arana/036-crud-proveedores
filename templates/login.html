{% extends "base.html" %}

{% block title %}Inicio de Sesión{% endblock %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-dark text-white text-center">
                <h2 class="mb-0">Inicio de Sesión</h2>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label
                            for="usuario"
                            class="form-label"
                        >
                            Usuario
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="usuario"
                            name="usuario"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                        >

                    </div>


                    <div class="mb-3 form-check">

                        <input
                            type="checkbox"
                            class="form-check-input"
                            id="recordarme"
                            name="recordarme"
                            value="Sí"
                        >

                        <label
                            class="form-check-label"
                            for="recordarme"
                        >
                            Recordarme
                        </label>

                    </div>


                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Iniciar sesión
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
